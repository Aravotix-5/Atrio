# Render Blueprint for Atrio.
# You can deploy without this file by creating the Web Service by hand,
# but this makes it repeatable. Secrets are NEVER stored here - every value
# marked `sync: false` must be typed into the Render dashboard.
services:
  - type: web
    name: atrio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
